<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Illegal Building Detection</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3211/3211620.png">
  <link rel="stylesheet" href="auth.css" />
  
  <!-- Redirect if already logged in -->
  <script>
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      window.location.replace('home.html');
    }
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>🔐 Login</h1>
      <p class="subtitle">Welcome back to BuildWatch</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Username or Email</label>
          <input type="text" id="username" required placeholder="Enter username or email">
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Enter password">
        </div>

        <button type="submit" class="auth-btn">Login</button>
      </form>

      <div id="errorMessage" style="display: none; margin-top: 15px; padding: 12px; background: #fee; color: #c00; border-radius: 8px; text-align: center;"></div>

      <p class="alt-text">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      
      if (!username || !password) {
        showError('Please fill in all fields');
        return;
      }

      try {
        console.log('🔄 Attempting login...');
        
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        console.log('📥 Response:', data);

        if (response.ok) {
          console.log('✅ Login successful!');
          
          // Store login state
          sessionStorage.setItem('isLoggedIn', 'true');
          sessionStorage.setItem('username', username);
          
          // Redirect to home
          window.location.replace('home.html');
        } else {
          showError(data.message || 'Login failed');
        }
      } catch (error) {
        console.error('❌ Login error:', error);
        showError('Connection error. Make sure backend is running on http://localhost:5000');
      }
    });

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.style.display = 'block';
      errorDiv.textContent = '❌ ' + message;
    }
  </script>
</body>
</html>
